<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- CSS Animations -->
    <style>
      .orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 18s ease-in-out infinite alternate;
      }
      .orb-3 {
        animation: floatOrb3 12s ease-in-out infinite alternate;
      }
      .card-float-1 {
        animation: floatCard1 6s ease-in-out infinite alternate;
      }
      .card-float-2 {
        animation: floatCard2 7s ease-in-out infinite alternate;
      }
      .card-float-3 {
        animation: floatCard3 6.5s ease-in-out infinite alternate;
      }
      .pulse-line {
        stroke-dasharray: 8 8;
        animation: dashMove 30s linear infinite;
      }
      .sparkle {
        animation: pulseScale 3s ease-in-out infinite alternate;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-70px, -30px) scale(1.2); }
      }
      @keyframes floatOrb3 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(40px, -40px); }
      }
      @keyframes floatCard1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes floatCard2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(12px); }
      }
      @keyframes floatCard3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulseScale {
        0% { opacity: 0.3; transform: scale(0.9); }
        100% { opacity: 0.9; transform: scale(1.1); }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Behind everything) -->
  <g opacity="0.45">
    <circle class="orb-1" cx="180" cy="110" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="300" r="160" fill="#a855f7" filter="url(#glow)" />
    <circle class="orb-3" cx="620" cy="60" r="120" fill="#6366f1" filter="url(#glow)" />
  </g>

  <!-- Tech Grid Background -->
  <g opacity="0.12" stroke="#cbd5e1" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" />
  </g>

  <!-- Dynamic Animated Tech Connector Lines -->
  <g opacity="0.25">
    <path class="pulse-line" d="M100 370 Q 350 320, 600 380 T 1100 340" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="pulse-line" d="M80 70 Q 300 130, 700 80 T 1120 120" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Dynamic Foreground Decorative Floating Feature Badges / Cards (Positioned safely outside title/subtitle) -->
  <!-- Left Side Floating Card -->
  <g class="card-float-1" transform="translate(60, 290)" filter="url(#cardShadow)">
    <rect width="210" height="70" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" backdrop-filter="blur(10px)" />
    <circle cx="36" cy="35" r="16" fill="#38bdf8" opacity="0.2" />
    <text x="36" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">⚡</text>
    <text x="64" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">AI Copywriting</text>
    <text x="64" y="49" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">High-Converting Prose</text>
  </g>

  <!-- Right Side Floating Card -->
  <g class="card-float-2" transform="translate(930, 290)" filter="url(#cardShadow)">
    <rect width="210" height="70" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />
    <circle cx="36" cy="35" r="16" fill="#a855f7" opacity="0.2" />
    <text x="36" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">📖</text>
    <text x="64" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Worldbuilding</text>
    <text x="64" y="49" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Novels &amp; Lorebooks</text>
  </g>

  <!-- Center-Right Top Pill -->
  <g class="card-float-3" transform="translate(940, 55)">
    <rect width="180" height="38" rx="19" fill="rgba(15, 23, 42, 0.7)" stroke="#818cf8" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#34d399" />
    <text x="34" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SaaS &amp; Open Source</text>
  </g>

  <!-- Center Foreground Title & Subtitle (Always Clear and Unobstructed) -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.2" />
    <text x="0" y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8">
    AI Copywriting &amp; Creative Storytelling
  </text>

  <!-- Accent Gradient Highlight Underline -->
  <rect x="360" y="178" width="480" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtitle Line 1 -->
  <text x="600" y="222" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
    The Ultimate Directory of Enterprise Writing Suites, Novel Editors &amp; Sovereign LLM Studios
  </text>

  <!-- Subtitle Line 2 (Key Themes) -->
  <text x="600" y="254" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
    Marketing Copy ✦ Interactive Fiction ✦ Lorebooks ✦ Autonomous Research ✦ Local Runtimes
  </text>

  <!-- Floating Sparkles -->
  <circle class="sparkle" cx="310" cy="120" r="3" fill="#38bdf8" />
  <circle class="sparkle" cx="890" cy="130" r="3.5" fill="#c084fc" />
  <circle class="sparkle" cx="540" cy="320" r="2.5" fill="#818cf8" />
  <circle class="sparkle" cx="660" cy="320" r="2.5" fill="#34d399" />
</svg>
